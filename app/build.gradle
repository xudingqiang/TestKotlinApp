plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.bella.testapp'
    compileSdkVersion 37

    defaultConfig {
        applicationId "com.bella.testapp"
        minSdk 30
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                // 正确写法：用 assignment 或 +=
                cFlags += ["-std=c11"]
                cppFlags += ["-std=c++17"]
            }
        }

        ndk {
            abiFilters "armeabi-v7a","arm64-v8a","x86","x86_64"
        }


    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }



    // AGP keeps its default debug keystore in ~/.android, which may not be writable in
    // sandboxed/CI environments, so point debug signing (and the androidTest APK) at a
    // project-local keystore instead.
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // AGP 9 built-in Kotlin: kotlin.compilerOptions.jvmTarget defaults to
    // compileOptions.targetCompatibility, so no explicit jvmTarget is needed.
    buildFeatures {
        compose true
        viewBinding true
    }

    lint {
        // 如果是 Lint 检查引起的可以关掉，但 AAR Metadata 报错通常用下面这个打包配置
    }

    testOptions {
        // The AppFunctions parameter-serialization test runs on the host JVM, where the
        // android.os stubs throw by default.
        unitTests.returnDefaultValues = true
    }
}

ksp {
    // Generate androidx.appfunctions.internal.$AggregatedAppFunctionInventory_Impl (and the other
    // aggregated components). Without this the appfunctions runtime cannot resolve any function
    // metadata, so AppFunctionManager.executeAppFunction fails before reaching the target app.
    arg("appfunctions:aggregateAppFunctions", "true")
}

